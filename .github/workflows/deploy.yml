name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  # Default to read-only; elevate only in deploy job.
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages is a PUBLIC, serverless site: in-browser WebLLM only, no
      # server LLM. NEVER hardcode a real API key or course-server URL here —
      # anything set in this file is baked into the published JS bundle and
      # anyone can read it out of the browser.
      #
      # SINGLE_MODE=local locks the site to WebLLM (in-browser) mode.
      # INJECT_API_CONFIG stays 'true' on purpose: the build only defines the
      # __SINGLE_MODE__ constant inside the "inject API" block, so we keep it
      # on to preserve the locked-local behavior — but every API_* value below
      # is EMPTY, so no key / base URL / model is published. (Empty __API_KEY__
      # / __API_BASE_URL__ are inert in local mode.)
      #
      # To ship a server-LLM build instead, set SINGLE_MODE=api and read the
      # API_* values from GitHub secrets — e.g.
      #   API_BASE_URL: ${{ secrets.API_BASE_URL }}
      #   API_KEY: ${{ secrets.API_KEY }}
      # Never commit real values.
      SINGLE_MODE: 'local'      # 'local' | 'api' | '' (empty = allow switching)
      INJECT_API_CONFIG: 'true' # keeps __SINGLE_MODE__ defined; see note above
      API_INJECT_TARGET: 'define'   # 'define' -> into JS; 'window' -> into HTML windowVars
      API_BASE_URL: ''            # EMPTY: no course-server URL in the public bundle
      API_KEY: ''                 # EMPTY: no secret in the public bundle
      API_MODEL: ''               # EMPTY
      # blank: INJECT_API_CONFIG decides panel visibility (hidden in local mode)
      API_HIDE_API_PANEL: ''

    
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential software-properties-common curl git wget
        
    - name: Build WebLLM Components
      run: |
        cd optlite-webllm/webllm-components
        # Disable Husky hooks in GitHub Actions; not needed for local builds.
        export HUSKY=0
        export HUSKY_SKIP_HOOKS=1
        # Normalize script line endings to avoid CI failures on bash runners.
        sed -i 's/\r$//' cleanup-index-js.sh
        # npm ci + committed lockfile avoids “same package.json, different transitive deps over time”
        npm ci --ignore-scripts
        chmod +x cleanup-index-js.sh
        chmod +x node_modules/.bin/rollup
        export PATH="$PATH:$(npm bin)"
        npm run build
        test -f lib/index.js

    - name: Build Python wheel
      run: |
        cd optlite-webllm/optlite-components
        # setup.py requires setuptools in Python 3.12 CI environments.
        pip install setuptools wheel
        python3 setup.py bdist_wheel -d dist

    - name: Build OPTLite Components
      run: |
        cd optlite-webllm/optlite-components
        # Use lockfile for reproducible installs in CI.
        npm ci
        chmod +x node_modules/.bin/webpack
        npm run build:prod
        
    - name: Verify build output
      run: |
        cd optlite-webllm/optlite-components
        echo "Build directory contents:"
        ls -la build/
        echo "Checking for key files:"
        if [ -f "build/index.html" ]; then
          echo "✓ index.html exists"
        else
          echo "✗ index.html missing"
        fi
        if [ -f "build/live.html" ]; then
          echo "✓ live.html exists"
        else
          echo "✗ live.html missing"
        fi
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        # Unique per workflow run for easier traceability.
        name: optlite-build-${{ github.run_number }}
        path: optlite-webllm/optlite-components/build/
        retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      # Required by peaceiris/actions-gh-pages to push gh-pages branch.
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: optlite-build-${{ github.run_number }}
          path: optlite-webllm/optlite-components/build

      - name: Verify deployment files
        run: |
          echo "Deployment directory contents:"
          ls -la optlite-webllm/optlite-components/build/
          echo "Total files:"
          find optlite-webllm/optlite-components/build/ -type f | wc -l

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: optlite-webllm/optlite-components/build
          publish_branch: gh-pages